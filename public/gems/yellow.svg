<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="yg-fill" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="0.2" stop-color="#fff385"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#8b5208"/>
    </radialGradient>
    <radialGradient id="yg-spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffdf2" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#fde68a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="yg-clip">
      <polygon points="32,3 39,24 61,24 43,37 50,60 32,46 14,60 21,37 3,24 25,24"/>
    </clipPath>
  </defs>
  <polygon points="32,3 39,24 61,24 43,37 50,60 32,46 14,60 21,37 3,24 25,24"
           fill="url(#yg-fill)" stroke="#2a1604" stroke-width="2.8" stroke-linejoin="round"/>
  <g clip-path="url(#yg-clip)">
    <!-- Inner star-cut facet -->
    <polygon points="32,15 36,26 47,26 38,33 42,45 32,38 22,45 26,33 17,26 28,26"
             fill="none" stroke="#fff6dc" stroke-width="0.8" opacity="0.4"/>
    <!-- Top inner bright facet -->
    <polygon points="32,3 39,24 32,32 25,24" fill="#fff8c2" opacity="0.3"/>
    <!-- Central radial gem-core -->
    <circle cx="32" cy="31" r="7" fill="url(#yg-spark)"/>
  </g>
</svg>
