<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="pg-fill" cx="0.35" cy="0.25" r="0.95">
      <stop offset="0" stop-color="#f5e8ff"/>
      <stop offset="0.22" stop-color="#d8b4fe"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#1e0640"/>
    </radialGradient>
    <radialGradient id="pg-bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3e8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f3e8ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pg-clip">
      <polygon points="32,3 57,17 57,47 32,61 7,47 7,17"/>
    </clipPath>
  </defs>
  <polygon points="32,3 57,17 57,47 32,61 7,47 7,17"
           fill="url(#pg-fill)" stroke="#10031f" stroke-width="2.8" stroke-linejoin="round"/>
  <g clip-path="url(#pg-clip)">
    <circle cx="32" cy="32" r="16" fill="url(#pg-bloom)"/>
    <g stroke="#1e0640" stroke-width="0.7" fill="none" opacity="0.55">
      <line x1="32" y1="32" x2="32" y2="3"/>
      <line x1="32" y1="32" x2="57" y2="17"/>
      <line x1="32" y1="32" x2="57" y2="47"/>
      <line x1="32" y1="32" x2="32" y2="61"/>
      <line x1="32" y1="32" x2="7" y2="47"/>
      <line x1="32" y1="32" x2="7" y2="17"/>
    </g>
    <polygon points="32,3 32,32 7,17" fill="#d8b4fe" opacity="0.32"/>
    <polygon points="32,32 57,47 32,61" fill="#1e0640" opacity="0.45"/>
    <!-- Specular sweep along the upper-left facet edge -->
    <ellipse cx="20" cy="13" rx="9" ry="3" fill="#fff" opacity="0.7" transform="rotate(-30 20 13)"/>
    <!-- Pinpoint catchlight -->
    <ellipse cx="18" cy="11" rx="2.4" ry="1.2" fill="#fff" transform="rotate(-30 18 11)"/>
  </g>
