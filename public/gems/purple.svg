<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="pg-fill" cx="0.3" cy="0.22" r="0.95">
      <stop offset="0" stop-color="#fdf6ff"/>
      <stop offset="0.2" stop-color="#cf9bff"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#3a0e8a"/>
    </radialGradient>
    <radialGradient id="pg-bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3e8ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f3e8ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pg-clip">
      <polygon points="32,3 57,17 57,47 32,61 7,47 7,17"/>
    </clipPath>
  </defs>
  <polygon points="32,3 57,17 57,47 32,61 7,47 7,17"
           fill="url(#pg-fill)" stroke="#10031f" stroke-width="2.8" stroke-linejoin="round"/>
  <g clip-path="url(#pg-clip)">
    <circle cx="32" cy="32" r="16" fill="url(#pg-bloom)"/>
    <!-- Six-wedge facet seams (cut-hexagon) -->
    <g stroke="#3a0e8a" stroke-width="0.6" fill="none" opacity="0.4">
      <line x1="32" y1="32" x2="32" y2="3"/>
      <line x1="32" y1="32" x2="57" y2="17"/>
      <line x1="32" y1="32" x2="57" y2="47"/>
      <line x1="32" y1="32" x2="32" y2="61"/>
      <line x1="32" y1="32" x2="7" y2="47"/>
      <line x1="32" y1="32" x2="7" y2="17"/>
    </g>
    <!-- Subtle top-left bright wedge -->
    <polygon points="32,3 32,32 7,17" fill="#cf9bff" opacity="0.2"/>
  </g>
</svg>
