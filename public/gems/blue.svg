      <stop offset="0.22" stop-color="#7fa9ff"/>
      <stop offset="0.55" stop-color="#2056d6"/>
      <stop offset="1" stop-color="#080f3e"/>
    </radialGradient>
    <radialGradient id="bg-bloom" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#cfe0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bg-clip">
