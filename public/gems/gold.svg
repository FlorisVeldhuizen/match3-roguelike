<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="au-fill" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#fff6c4"/>
      <stop offset="0.22" stop-color="#ffd56a"/>
      <stop offset="0.6" stop-color="#d18a16"/>
      <stop offset="1" stop-color="#4a2e05"/>
    </radialGradient>
    <radialGradient id="au-bloom" cx="0.5" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#fff3a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3a0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="au-clip">
      <circle cx="32" cy="32" r="29"/>
    </clipPath>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#au-fill)" stroke="#2a1604" stroke-width="2.8"/>
  <g clip-path="url(#au-clip)">
    <!-- Inner ring (engraved coin rim) -->
    <circle cx="32" cy="32" r="22" fill="none" stroke="#fff3a0" stroke-width="0.9" opacity="0.4"/>
    <circle cx="32" cy="32" r="20" fill="none" stroke="#5c3404" stroke-width="0.6" opacity="0.5"/>
    <!-- Bloom highlight off-center -->
    <circle cx="26" cy="26" r="11" fill="url(#au-bloom)"/>
    <!-- Subtle stamped sparkle -->
    <circle cx="22" cy="22" r="2.2" fill="#fffae0" opacity="0.6"/>
  </g>
</svg>
