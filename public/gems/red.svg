<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="rg-fill" cx="0.3" cy="0.22" r="0.95">
      <stop offset="0" stop-color="#fff5e0"/>
      <stop offset="0.18" stop-color="#ffa5a5"/>
      <stop offset="0.55" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#7a1414"/>
    </radialGradient>
    <radialGradient id="rg-bloom" cx="0.5" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#ffd5a0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffd5a0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rg-clip">
      <polygon points="32,3 60,32 32,61 4,32"/>
    </clipPath>
  </defs>
  <polygon points="32,3 60,32 32,61 4,32" fill="url(#rg-fill)" stroke="#2a0303" stroke-width="2.8" stroke-linejoin="round"/>
  <g clip-path="url(#rg-clip)">
    <circle cx="32" cy="34" r="14" fill="url(#rg-bloom)"/>
    <!-- Subtle light facet — just a hint of "cut stone" -->
    <polygon points="32,3 32,32 4,32" fill="#ffb4b4" opacity="0.18"/>
    <!-- Faint facet seams -->
    <g stroke="#ffd5d5" stroke-width="0.5" opacity="0.22">
      <line x1="32" y1="32" x2="32" y2="3"/>
      <line x1="32" y1="32" x2="4" y2="32"/>
    </g>
  </g>
</svg>
