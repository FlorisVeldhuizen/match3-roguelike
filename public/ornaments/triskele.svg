<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Celtic triskele (triple spiral) ornament.
  Three interlocked Archimedean spirals  the quintessential Celtic symbol
  representing cycles of life, death, and rebirth.
  Coloured in weathered bronze to match the Celtic palette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#c9a86c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer ring with knotwork-style dashes -->
  <circle cx="50" cy="50" r="46" stroke="#6b5232" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>
  <circle cx="50" cy="50" r="42" stroke="#9a7d52" stroke-width="0.8" opacity="0.35"/>

  <!-- Three spirals emanating from center, 120° apart -->
  <!-- Spiral 1 (top) -->
  <path d="M50 50
    C50 44, 55 39, 50 33
    C44 26, 34 30, 32 38
    C29 48, 36 58, 50 58
    C58 58, 62 52, 60 46" stroke="#c9a86c" stroke-width="2.8"/>

  <!-- Spiral 2 (bottom-right) -->
  <path d="M50 50
    C55 53, 60 51, 64 56
    C69 62, 63 72, 55 74
    C45 76, 38 68, 42 58
    C44 53, 50 52, 54 55" stroke="#c9a86c" stroke-width="2.8"/>

  <!-- Spiral 3 (bottom-left) -->
  <path d="M50 50
    C45 53, 40 51, 36 56
    C31 62, 37 72, 45 74
    C55 76, 62 68, 58 58
    C56 53, 50 52, 46 55" stroke="#c9a86c" stroke-width="2.8"/>

  <!-- Center hub  small filled circle -->
  <circle cx="50" cy="50" r="3.5" fill="#c9a86c" stroke="none"/>

  <!-- Accent dots at each spiral terminus -->
  <circle cx="50" cy="30" r="2" fill="#9a7d52" stroke="none"/>
  <circle cx="67" cy="67" r="2" fill="#9a7d52" stroke="none"/>
  <circle cx="33" cy="67" r="2" fill="#9a7d52" stroke="none"/>
</svg>
